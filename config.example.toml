# mp3blaster-rs configuration. Every setting is optional.

[general]
# Where the file manager starts; empty uses your Music folder.
default_music_dir = ""
resume_on_startup = true
gapless_playback = true
audio_buffer_ms = 150
# off, track or album
replaygain = "off"

[audio]
# Part of an output device name (see --list-devices); empty follows the Windows default.
output_device = ""

[ui]
fps = 60
show_spectrum = true
# wide (full-width strip under the playlist) or pane (inside Now Playing); f = fullscreen
spectrum_layout = "wide"
# bars, matrix (digital rain of the playing file's own bytes) or defrag
# (a disk defragmenter that finishes with the song) or hyperspace (3D demoscene);
# v cycles them
visualizer = "bars"
# HYPERSPACE quality: high, balanced or fast (fast sends the least to the terminal)
hyperspace_quality = "balanced"
# dracula, tokyo_night, one_dark, monokai, nord, catppuccin, gruvbox, classic_blue, monochrome (or press t in the player)
color_theme = "dracula"
# unicode or ascii (use ascii in the legacy console with raster fonts)
charset = "unicode"
show_hidden = false

[mcp]
# AI control: lets an MCP client such as Claude Code or Claude Desktop drive the player
# through `mp3blaster-rs --mcp` (localhost only, protected by a per-user token)
enabled = true
# Folders searched for songs besides the playlist (empty = the music folder)
library_dirs = []

[outputs]
# Port Sonos speakers and Cast devices fetch songs from (0 = any free port);
# set one for a firewall rule
http_port = 0
# Sonos speakers the network search cannot find (another subnet), e.g. ["192.168.1.20"]
sonos_hosts = []

